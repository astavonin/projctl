platform: github

github:
  repo: "astavonin/projctl"

labels:
  default:
    - "enhancement"

common:
  issue_template:
    required_sections:
      - "Description"
      - "Acceptance Criteria"

# Planning sync configuration
planning_sync:
  gdrive_base: ~/GoogleDrive

# Local docs/planning corpus search configuration (optional)
search:
  docs_path: "docs"
  related:
    - "../pi-cam-capture"
    - "../pi-bazel"
